{% extends 'base.html' %}

{% block title%}
<title>Update Supplier</title>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid">
        <h1 class="mt-4">Dashboard</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/supplier/">Supplier</a></li>
            <li class="breadcrumb-item active">Update Supplier</li>
        </ol>
        <div class="card mb-4">
            <div class="card-header">Update Supplier</div>
            <div class="card-body">
                <form action="/update-supplier/{{supplier.supplier_id}}" method="POST" >
                    <label for="sup_name" class="col-form-label">Supplier Name</label>
                    <input type="text" name="sup_name" id="sup_name" value="{{ supplier.sup_name }}" class="form-control" required>
                    <br>
                    <label for="sup_material_id" class="col-form-label">Material</label>
                    <input type="text" name="sup_material_id" id="sup_material_id" value="{{ supplier.sup_material_id }}" class="form-control">
                    <select name="sup_material_id" id="sup_material_id" class="form-control">
                        <option value="{{ supplier.sup_material_id }}" selected>{{ supplier.material.material_name }}</option>
                        {% for material in materials %}
                        <option value="{{ material.material_id }}">{{ material.material_name }}</option>
                        {% endfor %}
                    </select>
                    <br>
                    <label for="sup_contact_info" class="col-form-label">Contact</label>
                    <input type="text" name="sup_contact_info" id="sup_contact_info" value="{{ supplier.sup_contact_info }}" class="form-control">
                    <br>
                    <label for="sup_address" class="col-form-label">Address</label>
                    <input type="text" name="sup_address" id="sup_address" value="{{ supplier.sup_address }}" class="form-control" required>
                    <br>
                    
                                     
                    <input id="submit" type="submit" value="Update" class="btn btn-primary">
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
