
{% extends 'base.html' %}

{% block title %}
    <title>Shipping Management</title>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid">
        <h1 class="mt-4">Shipping Details for Order {{order.order_id}}</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
            <li class="breadcrumb-item active">Shipping </li>
        </ol>

        <!-- Create Shipping Form -->
        <div class="card mb-4">
            <div class="card-header">Shipping Details </div>
            <div class="card-body">
                <form method="POST" id="shipping-order-form">
                    <input type="hidden" name="order_id" value="{{ order.order_id }}">

                    <div class="form-group">
                        <label for="material_name">Customer Name</label>
                        <input type="text" name="material_name" id="material_name" class="form-control" value="{{ order.cus_name }}" readonly>
                    </div>
                    <div class="form-group">
                        <label for="material_name">Customer Contact</label>
                        <input type="text" name="material_name" id="material_name" class="form-control" value="{{ order.cus_contact }}" readonly>
                    </div>
                    <div class="form-group">
                        <label for="material_name">Customer Address</label>
                        <input type="text" name="material_name" id="material_name" class="form-control" value="{{ order.cus_address }}" readonly>
                    </div>

                    <div class="form-group">
                        <label for="pay_method">Payment Method</label>
                        <select class="form-control" id="pay_method" name="pay_method" required>
                            <option value=" Credit Card"> Credit Card</option>
                            <option value="PayPal">PayPal</option>
                            <option value="Cash on Delivery">Cash on Delivery</option>
                            <!-- <option value="USPS">USPS</option> -->
                        </select>
                    </div>
        
                    <div class="form-group">
                        <label for="provider">Logistics Provider</label>
                        <select class="form-control" id="provider" name="provider" required>
                            <option value="GiaoHangNhanh">GiaoHangNhanh</option>
                            <option value="J&T Express">J&T Express</option>
                            <option value="Viettel Post">Viettel Post</option>
                            <option value="Giaohangtietkiem">Giaohangtietkiem</option>
                            <option value="BEST Express">BEST Express</option>
                        </select>
                    </div>
        
                    <div class="form-group">
                        <label for="shipping_cost">Shipping Cost</label>
                        <input type="number" class="form-control" id="shipping_cost" name="shipping_cost" step="0.01" required>
                        <small class="form-text text-muted">The shipping cost will be calculated based on the selected provider.</small>
                    </div>

        
                   
                    <button type="submit" class="btn btn-primary">Create Ship</button>
                    <a href="/shipping-queue/" class="btn btn-secondary">Back </a>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
