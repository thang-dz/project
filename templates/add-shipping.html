{% extends 'base.html' %}

{% block title %}
    <title>Shipping Management</title>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid">
        <h1 class="mt-4">Shipping Management</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
            <li class="breadcrumb-item active">Shipping Management</li>
        </ol>

        <!-- Create Shipping Form -->
        <div class="card mb-4">
            <div class="card-header">Create Shipping</div>
            <div class="card-body">
                <form action="{{ url_for('shipping') }}" method="POST">
                    <label for="order_id" class="col-form-label">Order ID</label>
                    <input type="text" name="order_id" id="order_id" class="form-control" required>
                    <br>
                    <label for="provider" class="col-form-label">Shipping Provider</label>
                    <select name="provider" id="provider" class="form-control" required>
                        <option value="Provider 1">Provider 1</option>
                        <option value="Provider 2">Provider 2</option>
                        <option value="Provider 3">Provider 3</option>
                    </select>
                    <br>
                    <label for="tracking_code" class="col-form-label">Tracking Code</label>
                    <input type="text" name="tracking_code" id="tracking_code" class="form-control" required>
                    <br>
                    <label for="status" class="col-form-label">Status</label>
                    <select name="status" id="status" class="form-control" required>
                        <option value="Pending">Pending</option>
                        <option value="Shipped">Shipped</option>
                        <option value="Delivered">Delivered</option>
                    </select>
                    <br>
                    <button type="submit" class="btn btn-primary">Create Shipping</button>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
