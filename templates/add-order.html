{% extends 'base.html' %}

{% block title %}
    <title>Add New Order</title>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid">
        <h1 class="mt-4">Add New Order</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
            <li class="breadcrumb-item active">Add Order</li>
        </ol>

        <div class="card mb-4">
            <div class="card-header">New Order</div>
            <div class="card-body">
                <form method="POST" onsubmit="updateTotalPrice()">
                    <!-- Customer Information -->
                    <label for="cus_name" class="col-form-label">Customer Name <span class="text-danger">*</span></label>
                    <input type="text" name="cus_name" id="cus_name" class="form-control" required>
                    <br>

                    <label for="cus_contact" class="col-form-label">Customer Contact<span class="text-danger">*</span></label>
                    <input type="text" name="cus_contact" id="cus_contact" class="form-control" required>
                    <br>

                    <label for="cus_address" class="col-form-label">Customer Address<span class="text-danger">*</span></label>
                    <input type="text" name="cus_address" id="cus_address" class="form-control" required>
                    <br>

                    <!-- Product Information -->
                    <div id="product-fields">
                        <div class="product-field">
                            <label for="product_name" class="col-form-label">Product Name <span class="text-danger">*</span></label>
                            <input type="text" name="product_name[]" class="form-control" placeholder="Product Name" required>
                            <br>

                            <label for="product_price" class="col-form-label">Product Price <span class="text-danger">*</span></label>
                            <input type="number" name="product_price[]" class="form-control" placeholder="Product Price" required oninput="calculateTotalPrice()">
                            <br>

                            <label for="quantity" class="col-form-label">Quantity <span class="text-danger">*</span></label>
                            <input type="number" name="quantity[]" class="form-control" required oninput="calculateTotalPrice()">
                            <br>
                        </div>
                    </div>

                    <button type="button" onclick="addProductField()" class="btn btn-secondary">Add Another Product</button>
                    <br><br>

                    <!-- Total Price -->
                    <label for="price" class="col-form-label">Total Price <span class="text-danger">*</span></label>
                    <input type="number" name="price" id="price" class="form-control" required readonly>
                    <br>

                    <input type="submit" value="Add Order" class="btn btn-primary">
                </form>
            </div>
        </div>
    </div>
</main>

<script>
    // Function to calculate the total price for all products
    function calculateTotalPrice() {
        let productPrices = document.querySelectorAll('input[name="product_price[]"]');
        let quantities = document.querySelectorAll('input[name="quantity[]"]');
        let totalPrice = 0;

        // Loop through each product to calculate the total price
        productPrices.forEach((productPrice, index) => {
            let price = parseFloat(productPrice.value) || 0;
            let quantity = parseInt(quantities[index].value) || 0;
            totalPrice += price * quantity;
        });

        // Set the total price for the order
        document.getElementById('price').value = totalPrice.toFixed(2);
    }

    // Add new product fields dynamically
    function addProductField() {
        const productFieldsContainer = document.getElementById("product-fields");
        const newProductField = document.createElement("div");
        newProductField.classList.add("product-field");
        newProductField.innerHTML = `
            <label for="product_name" class="col-form-label">Product Name <span class="text-danger">*</span></label>
            <input type="text" name="product_name[]" class="form-control" placeholder="Product Name" required>
            <br>

            <label for="product_price" class="col-form-label">Product Price <span class="text-danger">*</span></label>
            <input type="number" name="product_price[]" class="form-control" placeholder="Product Price" required oninput="calculateTotalPrice()">
            <br>

            <label for="quantity" class="col-form-label">Quantity <span class="text-danger">*</span></label>
            <input type="number" name="quantity[]" class="form-control" required oninput="calculateTotalPrice()">
            <br>
        `;
        productFieldsContainer.appendChild(newProductField);
    }

    // Ensure total price is calculated before form submission
    function updateTotalPrice() {
        calculateTotalPrice();
    }
</script>

{% endblock %}
