{% extends 'base.html' %}

{% block title %}
    <title>Add New Order</title>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid mt-5">
        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-dark font-weight-bold" style="font-size: 2rem;">
                <i class="fas fa-cart-plus"></i> Add New Order
            </h1>
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-muted"><i class="fas fa-home mr-1"></i> Dashboard</a></li>
                <li class="breadcrumb-item active">Add Order</li>
            </ol>
        </div>

        <div class="card shadow-lg border-0 mb-4">
            <div class="card-header bg-primary text-white font-weight-bold">
                <i class="fas fa-plus-circle"></i> New Order
            </div>
            <div class="card-body">
                <form method="POST" onsubmit="return updateTotalPrice(event)">
                    <!-- Customer Information -->
                    <div class="mb-3">
                        <label for="cus_name" class="col-form-label">Customer Name <span class="text-danger">*</span></label>
                        <input type="text" name="cus_name" id="cus_name" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="cus_contact" class="col-form-label">Customer Contact<span class="text-danger">*</span></label>
                        <input type="number" name="cus_contact" id="cus_contact" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="cus_address" class="col-form-label">Customer Address<span class="text-danger">*</span></label>
                        <input type="text" name="cus_address" id="cus_address" class="form-control" required>
                    </div>

                    <!-- Product Information -->
                    <div id="product-fields">
                        <div class="product-field mb-3">
                            <label for="product_name" class="col-form-label">Product Name <span class="text-danger">*</span></label>
                            <input type="text" name="product_name[]" class="form-control" placeholder="Product Name" required>
                            <br>

                            <label for="product_price" class="col-form-label">Product Price <span class="text-danger">*</span></label>
                            <input type="number" name="product_price[]" class="form-control" placeholder="Product Price" required oninput="calculateTotalPrice()">
                            <br>

                            <label for="quantity" class="col-form-label">Quantity <span class="text-danger">*</span></label>
                            <input type="number" name="quantity[]" class="form-control" placeholder="Enter quantity" required oninput="calculateTotalPrice()">
                            <br>
                        </div>
                    </div>

                    <!-- Add Product Button -->
                    <button type="button" class="btn btn-info mb-3" onclick="addProductField()">
                        <i class="fas fa-plus"></i> Add Product
                    </button>

                    <!-- Deposit Percentage -->
                    <div class="mb-3">
                        <label for="deposit_percent" class="col-form-label">Deposit Percentage (%) <span class="text-danger">*</span></label>
                        <input type="number" id="deposit_percent" name="deposit_percent" class="form-control" placeholder="Enter deposit % " max="100" oninput="calculateDepositAmount()">
                    </div>

                    <!-- Deposit Amount -->
                    <div class="mb-3">
                        <label for="deposit_amount" class="col-form-label">Deposit Amount</label>
                        <input type="number" id="deposit_amount" min="0" name="deposit_amount" class="form-control" readonly>
                    </div>

                    <!-- Total Price -->
                    <div class="mb-3">
                        <label for="price" class="col-form-label">Total Price <span class="text-danger">*</span></label>
                        <input type="number" name="price" id="price" class="form-control" required readonly>
                    </div>

                    <div class="d-flex justify-content-between">
                        <input type="submit" value="Add Order" class="btn btn-primary">
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script>
// Function to calculate the total price for all products
function calculateTotalPrice() {
    let productPrices = document.querySelectorAll('input[name="product_price[]"]');
    let quantities = document.querySelectorAll('input[name="quantity[]"]');
    let totalPrice = 0;

    // Loop through each product to calculate the total price
    productPrices.forEach((productPrice, index) => {
        let price = parseFloat(productPrice.value) || 0;
        let quantity = parseInt(quantities[index].value) || 0;
        totalPrice += price * quantity;
    });

    // Set the total price for the order
    document.getElementById('price').value = totalPrice.toFixed(2);
    calculateDepositAmount();  // Recalculate deposit amount whenever the total price changes
}

// Function to calculate the deposit amount
function calculateDepositAmount() {
    const totalPrice = parseFloat(document.getElementById("price").value) || 0;
    const depositPercent = parseFloat(document.getElementById("deposit_percent").value) || 0;
    const depositAmount = (totalPrice * depositPercent) / 100;
    document.getElementById("deposit_amount").value = depositAmount.toFixed(2);
}

// Function to add new product fields dynamically
function addProductField() {
    const productFieldsContainer = document.getElementById("product-fields");
    const newProductField = document.createElement("div");
    newProductField.classList.add("product-field", "mb-3");
    newProductField.innerHTML = `
        <label for="product_name" class="col-form-label">Product Name <span class="text-danger">*</span></label>
        <input type="text" name="product_name[]" class="form-control" placeholder="Product Name" required>
        <br>

        <label for="product_price" class="col-form-label">Product Price <span class="text-danger">*</span></label>
        <input type="number" name="product_price[]" class="form-control" placeholder="Product Price" required oninput="calculateTotalPrice()">
        <br>

        <label for="quantity" class="col-form-label">Quantity <span class="text-danger">*</span></label>
        <input type="number" name="quantity[]" class="form-control" required oninput="calculateTotalPrice()">
        <br>
    `;
    productFieldsContainer.appendChild(newProductField);
}

// Ensure form submission is only allowed after validation
function validateForm(event) {
    let quantities = document.querySelectorAll('input[name="quantity[]"]');
    let depositPercent = parseFloat(document.getElementById("deposit_percent").value) || 0;
    let totalPrice = parseFloat(document.getElementById("price").value) || 0;

    // Validate Quantity
    for (let quantity of quantities) {
        let quantityValue = parseInt(quantity.value) || 0;
        if (quantityValue <= 0) {
            alert("Quantity must be greater than 0.");
            event.preventDefault(); // Prevent form submission
            return false;
        }
    }

    // Validate Deposit Percentage
    if (depositPercent <= 0) {
        alert("Deposit Percentage must be greater than 0.");
        event.preventDefault(); // Prevent form submission
        return false;
    }

    // Validate Total Price
    if (totalPrice <= 0) {
        alert("Total Price must be greater than 0.");
        event.preventDefault(); // Prevent form submission
        return false;
    }

    return true; // Allow form submission
}

// Update the form's onsubmit to call validateForm and calculate total price
function updateTotalPrice(event) {
    if (!validateForm(event)) {
        return false; // Prevent form submission if validation fails
    }
    calculateTotalPrice();
    return true; // Allow form submission
}
</script>

{% endblock %}
