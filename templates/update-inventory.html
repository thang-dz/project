{% extends 'base.html' %}

{% block title %}
    <title>Update Inventory</title>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid">
        <h1 class="mt-4">Update Inventory for {{ inventory.product_name }}</h1>
        <form method="POST">
            <label for="quantity_removed">Quantity to Remove:</label>
            <input type="number" name="quantity_removed" required class="form-control" value="{{ inventory.quantity }}">
            <br>

            <input type="submit" value="Update Inventory" class="btn btn-primary">
        </form>
    </div>
</main>
{% endblock %}
