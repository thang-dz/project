{% extends 'base.html' %}

{% block title %}
    <title>Add New Order</title>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid">
        <h1 class="mt-4">Add New Order</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
            <li class="breadcrumb-item active">Add Order</li>
        </ol>

        <div class="card mb-4">
            <div class="card-header">New Order</div>
            <div class="card-body">
                <form method="POST">
                    <div class="form-group">
                        <label for="material_name">Material Name</label>
                        <input type="text" name="material_name" id="material_name" class="form-control" value="{{ material_name }}" readonly>
                    </div>
                
                    <!-- <div class="form-group">
                        <label for="material_description">Material Description</label>
                        <input type="text" name="material_description" id="material_description" class="form-control" value="{{ material_description }}" readonly>
                    </div> -->
                
                    <div class="form-group">
                        <label for="reorder_level">Reorder Level</label>
                        <input type="number" name="reorder_level" id="reorder_level" class="form-control" value="{{ reorder_level }}" readonly>
                    </div>
                
                    <div class="form-group">
                        <label for="quantity_in_stock">Quantity to Order <span class="text-danger">*</span></label>
                        <input type="number" name="quantity_in_stock" id="quantity_in_stock" min="0" class="form-control" value="{{ prefilled_quantity }}" required>
                    </div>
                
                    <div class="form-group">
                        <label for="sup_name">Supplier Name</label>
                        <input type="text" name="sup_name" id="sup_name" value="{{ sup_name }}" class="form-control" required>
                    </div>
                
                    <div class="form-group">
                        <label for="sup_contact_info">Supplier Contact Info</label>
                        <input type="text" name="sup_contact_info" id="sup_contact_info" value="{{ sup_contact_info }}" class="form-control" required>
                    </div>
                
                    <div class="form-group">
                        <label for="sup_address">Supplier Address</label>
                        <input type="text" name="sup_address" id="sup_address" value="{{ sup_address }}" class="form-control" required>
                    </div>
                
                    <button type="submit" class="btn btn-primary">Add Import</button>
                </form>
                
            </div>
        </div>
    </div>
</main>
{% endblock %}
