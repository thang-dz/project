{% extends 'base.html' %}

{% block title %}
    <title>Update Order</title>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid">
        <h1 class="mt-4">Update Order</h1>

        <!-- Order Update Form -->
        <form action="/update-order/{{ order.order_id }}" method="POST">
            <!-- Customer Information -->
            <label for="cus_name" class="col-form-label">Customer Name</label>
            <input type="text" name="cus_name" class="form-control" value="{{ order.cus_name }}" required><br>

            <label for="cus_contact" class="col-form-label">Customer Contact</label>
            <input type="text" name="cus_contact" class="form-control" value="{{ order.cus_contact }}"><br>

            <label for="cus_address" class="col-form-label">Customer Address</label>
            <input type="text" name="cus_address" class="form-control" value="{{ order.cus_address }}"><br>

            <!-- Product Details (Only 1 Product) -->
            {% for order_detail in order.order_details %}
                <div class="product-entry">
                    <label for="product_name" class="col-form-label">Product Name</label>
                    <input type="text" name="product_names[]" class="form-control product-name" value="{{ order_detail.product_name }}" required><br>

                    <label for="product_price" class="col-form-label">Product Price</label>
                    <input type="number" name="product_prices[]" class="form-control product-price" value="{{ order_detail.product_price }}" required oninput="calculateTotalPrice()"><br>

                    <label for="quantity" class="col-form-label">Quantity</label>
                    <input type="number" name="quantities[]" class="form-control quantity" value="{{ order_detail.quantity }}" required oninput="calculateTotalPrice()"><br>
                </div>
            {% endfor %}

            <label for="price" class="col-form-label">Total Price</label>
            <input type="number" name="price" class="form-control" value="{{ order.price }}" readonly><br>

            <button type="submit" class="btn btn-primary">Update Order</button>
        </form>
    </div>
</main>

<script>
    // Function to calculate the total price for all products in the order
    function calculateTotalPrice() {
        let totalOrderPrice = 0;

        // Loop through each product entry and calculate total price
        let productPrices = document.querySelectorAll('.product-price');
        let quantities = document.querySelectorAll('.quantity');

        productPrices.forEach(function(price, index) {
            let productPrice = parseFloat(price.value) || 0;
            let quantity = parseInt(quantities[index].value) || 0;
            let totalPrice = productPrice * quantity;

            // Update the total price for this product
            totalOrderPrice += totalPrice;
        });

        // Set the total price for the order
        document.querySelector('input[name="price"]').value = totalOrderPrice.toFixed(2);
    }

    // Ensure the total price field is updated before form submission
    function updateTotalPrice() {
        calculateTotalPrice();
    }
</script>

{% endblock %}
