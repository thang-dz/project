{% extends 'base.html' %}

{% block title %}
<title>Add Product Batch</title>


{% endblock %}

{% block content %}
<main class="container-fluid mt-5">
    <!-- Header Section -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="text-dark font-weight-bold">Add New Product Batch</h1>
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-muted"><i class="fas fa-home mr-1"></i> Dashboard</a></li>
            <li class="breadcrumb-item active">Add Product Batch</li>
        </ol>
    </div>

    <!-- Product Batch Form -->
    <div class="card shadow-lg border-0 mb-4">
        <div class="card-header bg-primary text-white font-weight-bold">
            Product Batch Form
        </div>
        <div class="card-body">
            <form method="POST">
                <!-- Select Product -->
                <div class="form-group mb-3">
                    <label for="order_detail_id" class="font-weight-semibold text-dark">Select Product <span class="text-danger">*</span></label>
                    <select class="form-control selectpicker" id="order_detail_id" name="order_detail_id" required data-live-search="true">
                        <option value="" disabled selected>Select a product</option>
                        {% for order in order_details %}
                            <option value="{{ order.order_detail_id }}">{{ order.product_name }} (Order: {{ order.order_relation.order_id }})</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Batch Number -->
                <div class="form-group mb-3">
                    <label for="batch_number" class="font-weight-semibold text-dark">Batch Number <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="batch_number" name="batch_number" required placeholder="Enter Batch Number">
                </div>

                <!-- Category -->
                <div class="form-group mb-3">
                    <label for="category" class="font-weight-semibold text-dark">Category <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="category" name="category" required placeholder="Enter Category">
                </div>

                <!-- Select Materials -->
                <div class="form-group mb-4">
                    <label for="material_ids" class="font-weight-semibold text-dark">Select Materials <span class="text-danger">*</span></label>
                    <select class="form-control selectpicker" id="material_ids" name="material_ids" multiple required data-live-search="true">
                        {% for item in inventory %}
                            <option value="{{ item.stockTran_id }}">{{ item.product_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Buttons -->
                <div class="form-group d-flex justify-content-between">
                    <button type="submit" class="btn btn-dark px-4 py-2">Add Batch</button>
                    <a href="/view-product-batches/" class="btn btn-secondary px-4 py-2">Back to Batches</a>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
