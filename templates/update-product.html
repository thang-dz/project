{% extends 'base.html' %}

{% block title%}
<title>Update Product</title>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid">
        <h1 class="mt-4">Dashboard</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/products/">Products</a></li>
            <li class="breadcrumb-item active">Update Product</li>
        </ol>
        <div class="card mb-4">
            <div class="card-header">Update Product</div>
            <div class="card-body">
                <form action="/update-product/{{product.product_id}}" method="POST" id="product_form">
                    <label for="product_name" class="col-form-label">Product Name</label>
                    <input type="text" name="product_name" id="product_name" value="{{ product.pro_name }}" class="form-control" required>
                    <br>
                    <label for="pro_category" class="col-form-label">Category</label>
                    <input type="text" name="pro_category" id="pro_category" value="{{ product.pro_category }}" class="form-control">
                    <br>
                    <label for="pro_unit_price" class="col-form-label">Unit Price</label>
                    <input type="text" name="pro_unit_price" id="pro_unit_price" value="{{ product.pro_unit_price }}" class="form-control" required>
                    <br>
                    <label for="pro_stock" class="col-form-label">Stock</label>
                    <input type="text" name="pro_stock" id="pro_stock" value="{{ product.pro_stock }}" class="form-control" required>
                    <br>
                    <label for="pro_reorder_level" class="col-form-label">Reorder Level</label>
                    <input type="text" name="pro_reorder_level" id="pro_reorder_level" value="{{ product.pro_reorder_level }}" class="form-control">
                    <br>
                    <label for="pro_supplier_id" class="col-form-label">Supplier </label>
                    <input type="text" name="pro_supplier_id" id="pro_supplier_id" value="{{ product.pro_supplier_id }}" class="form-control">
                    <select name="pro_supplier_id" id="pro_supplier_id" class="form-control">
                        <option value="{{ product.pro_supplier_id }}" selected>{{ product.supplier.sup_name }}</option>
                        {% for supplier in suppliers %}
                        <option value="{{ supplier.supplier_id }}">{{ supplier.sup_name }}</option>
                        {% endfor %}
                    </select>
                    <br>
                    <input id="submitProduct" type="submit" value="Update" class="btn btn-primary">
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock %}
