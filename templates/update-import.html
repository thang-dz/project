{% extends 'base.html' %}

{% block title %}
    <title>Update Import</title>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid mt-5">
        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-dark font-weight-bold" style="font-size: 2rem;">
                <i class="fas fa-edit"></i> Update Import
            </h1>
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-muted"><i class="fas fa-home mr-1"></i> Dashboard</a></li>
                <li class="breadcrumb-item active">Update Import</li>
            </ol>
        </div>
        <div class="card shadow-lg border-0 mb-4">
            <div class="card-header bg-primary text-white font-weight-bold">
                <i class="fas fa-plus-circle"></i> New Order
            </div>
            <div class="card-body">
                <!-- Form to Update Import -->
                <form id="product_form" action="/update-import/{{ import_record.import_id }}" method="POST" onsubmit="return checkForm(event)">
                    <!-- Material Information -->
                    <div class="form-group">
                        <label for="material_name"><i class="fas fa-cogs"></i> Material Name <span class="text-danger">*</span></label>
                        <input id="material_name" type="text" name="material_name" class="form-control" value="{{ import_record.material_name }}" required>
                    </div>

                    <div class="form-group">
                        <label for="quantity_in_stock"><i class="fas fa-box"></i> Quantity in Stock <span class="text-danger">*</span></label>
                        <input id="quantity_in_stock" type="number" name="quantity_in_stock" class="form-control" value="{{ import_record.quantity_in_stock }}" required>
                    </div>

                    <div class="form-group">
                        <label for="reorder_level"><i class="fas fa-arrow-up"></i> Reorder Level</label>
                        <input id="reorder_level" type="number" name="reorder_level" class="form-control" value="{{ import_record.reorder_level }}">
                    </div>

                    <!-- Supplier Information -->
                    <div class="form-group">
                        <label for="sup_name"><i class="fas fa-user"></i> Supplier Name <span class="text-danger">*</span></label>
                        <input id="sup_name" type="text" name="sup_name" class="form-control" value="{{ import_record.sup_name }}" required>
                    </div>

                    <div class="form-group">
                        <label for="sup_contact_info"><i class="fas fa-phone"></i> Supplier Contact Info <span class="text-danger">*</span></label>
                        <input id="sup_contact_info" type="text" name="sup_contact_info" class="form-control" value="{{ import_record.sup_contact_info }}" required>
                    </div>

                    <div class="form-group">
                        <label for="sup_address"><i class="fas fa-map-marker-alt"></i> Supplier Address <span class="text-danger">*</span></label>
                        <input id="sup_address" type="text" name="sup_address" class="form-control" value="{{ import_record.sup_address }}" required>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Update Import</button>
                    <div id="loading-spinner" style="display: none; margin-top: 10px;">
                        <i class="fas fa-spinner fa-spin text-primary"></i> Validating...
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<script>
    async function checkForm(event) {
        event.preventDefault();

        document.getElementById('loading-spinner').style.display = 'inline-block';

        const materialName = document.getElementById('material_name').value.trim();
        const quantityInStock = parseInt(document.getElementById('quantity_in_stock').value);
        const supName = document.getElementById('sup_name').value.trim();

        if (!/^[\p{L}\p{M}\s]+$/u.test(materialName)) {
            alert("Material Name must contain only letters.");
            document.getElementById('loading-spinner').style.display = 'none';
            return false;
        }

        if (isNaN(quantityInStock) || quantityInStock <= 0) {
            alert("Quantity must be greater than 0.");
            document.getElementById('loading-spinner').style.display = 'none';
            return false;
        }

        if (!/^[\p{L}\p{M}\s]+$/u.test(supName)) {
            alert("Supplier Name must contain only letters.");
            document.getElementById('loading-spinner').style.display = 'none';
            return false;
        }

        try {
            const response = await fetch('/check-material-existence?material_name=' + encodeURIComponent(materialName));
            if (response.ok) {
                const data = await response.json();                
                document.getElementById('product_form').submit();
                
            } else {
                alert("Error checking material name.");
                document.getElementById('loading-spinner').style.display = 'none';
                return false;
            }
        } catch (error) {
            alert("An unexpected error occurred.");
            document.getElementById('loading-spinner').style.display = 'none';
            return false;
        }
    }
</script>
{% endblock %}
