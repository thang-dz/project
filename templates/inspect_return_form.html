<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra Yêu Cầu Trả Hàng</title>
</head>
<body>
    <h1>Kiểm Tra Yêu Cầu Trả Hàng</h1>
    
    <form action="{{ url_for('inspect_return', return_id=return_request.return_id) }}" method="POST">
        <label for="condition">Tình Trạng Sản Phẩm:</label>
        <select name="condition" id="condition" required>
            <option value="Good">Tốt</option>
            <option value="Defective">Lỗi</option>
            <option value="Requires Repair">Cần Sửa Chữa</option>
        </select>
        
        <div id="defective-reason" style="display: none;">
            <label for="defect_reason">Lý Do Lỗi:</label>
            <input type="text" id="defect_reason" name="defect_reason">
        </div>

        <div id="repair-time" style="display: none;">
            <label for="repair_time">Thời Gian Sửa Chữa Ước Tính (ngày):</label>
            <input type="number" id="repair_time" name="repair_time" value="3">
        </div>

        <button type="submit">Kiểm Tra</button>
    </form>

    <script>
        const conditionSelect = document.getElementById('condition');
        const defectReasonDiv = document.getElementById('defective-reason');
        const repairTimeDiv = document.getElementById('repair-time');

        conditionSelect.addEventListener('change', function () {
            if (conditionSelect.value === 'Defective') {
                defectReasonDiv.style.display = 'block';
                repairTimeDiv.style.display = 'none';
            } else if (conditionSelect.value === 'Requires Repair') {
                repairTimeDiv.style.display = 'block';
                defectReasonDiv.style.display = 'none';
            } else {
                defectReasonDiv.style.display = 'none';
                repairTimeDiv.style.display = 'none';
            }
        });
    </script>
</body>
</html>
