{% extends 'base.html' %}

{% block title %}
<title>Add New Import</title>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid mt-5">
        <!-- Header Section -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="text-dark font-weight-bold" style="font-size: 2rem;">Add New Import</h1>
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="/" class="text-decoration-none text-muted"><i class="fas fa-home mr-1"></i> Dashboard</a></li>
                <li class="breadcrumb-item active">Add Import</li>
            </ol>
        </div>

        <!-- Import Form -->
        <div class="card shadow-lg border-0 mb-4">
            <div class="card-header bg-primary text-white font-weight-bold">
                <i class="fas fa-box-open"></i> New Import Form
            </div>
            <div class="card-body">
                <form id="product_form" action="/import/" method="POST" onsubmit="return checkForm(event)">
                    <!-- Material Name -->
                    <div class="form-group mb-3">
                        <label for="material_name" class="font-weight-semibold text-dark">Material Name <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-cogs"></i></span>
                            </div>
                            <input type="text" id="material_name" name="material_name" class="form-control" required placeholder="Enter Material Name">
                        </div>
                    </div>
        
                    <!-- Quantity -->
                    <div class="form-group mb-3">
                        <label for="quantity_in_stock" class="font-weight-semibold text-dark">Quantity <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-sort-amount-up"></i></span>
                            </div>
                            <input type="number" id="quantity_in_stock" name="quantity_in_stock" class="form-control" required placeholder="Enter Quantity">
                        </div>
                    </div>
        
                    <!-- Reorder Level -->
                    <div class="form-group mb-3">
                        <label for="reorder_level" class="font-weight-semibold text-dark">Reorder Level</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-arrow-down"></i></span>
                            </div>
                            <input type="number" name="reorder_level" class="form-control" value="30" placeholder="Enter Reorder Level">
                        </div>
                    </div>
        
                    <!-- Supplier Name -->
                    <div class="form-group mb-3">
                        <label for="sup_name" class="font-weight-semibold text-dark">Supplier Name <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-building"></i></span>
                            </div>
                            <input type="text" id="sup_name" name="sup_name" class="form-control" required placeholder="Enter Supplier Name">
                        </div>
                    </div>
        
                    <!-- Supplier Phone Number -->
                    <div class="form-group mb-3">
                        <label for="sup_contact_info" class="font-weight-semibold text-dark">Supplier Phone Number <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-phone"></i></span>
                            </div>
                            <input type="number" name="sup_contact_info" class="form-control" required placeholder="Enter Supplier Phone Number">
                        </div>
                    </div>
        
                    <!-- Supplier Address -->
                    <div class="form-group mb-4">
                        <label for="sup_address" class="font-weight-semibold text-dark">Supplier Address <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                            </div>
                            <input type="text" name="sup_address" class="form-control" required placeholder="Enter Supplier Address">
                        </div>
                    </div>
        
                    <!-- Submit Button -->
                    <div class="form-group d-flex justify-content-between">
                        <button type="submit" class="btn btn-primary px-4 py-2 hover-shadow">Add Material</button>
                        <a href="/import/" class="btn btn-secondary px-4 py-2 hover-shadow">Back to Imports</a>
                    </div>
                </form>

                <!-- Loading Spinner -->
                <div id="loading-spinner" class="spinner-border text-primary" role="status" style="display: none;">
                    <span class="sr-only">Loading...</span>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
    async function checkForm(event) {
        event.preventDefault(); // Prevent the form from submitting until validation is complete
        
        // Show loading spinner while validating
        document.getElementById('loading-spinner').style.display = 'inline-block';

        // Validate Material Name (only alphabets and spaces)
        const materialName = document.getElementById('material_name').value;
        const isMaterialAlphabetic =  /^[\p{L}\p{M}\s]+$/u.test(materialName);

        if (!isMaterialAlphabetic) {
            alert("Material Name must contain only letters.");
            document.getElementById('loading-spinner').style.display = 'none';
            return false; // Prevent form submission
        }
        
        // Validate Quantity (greater than 0)
        const quantityInStock = document.getElementById('quantity_in_stock').value;
        if (quantityInStock <= 0) {
            alert("Quantity must be greater than 0.");
            document.getElementById('loading-spinner').style.display = 'none';
            return false; // Prevent form submission
        }

        // Validate Supplier Name (only alphabets and spaces)
        const supName = document.getElementById('sup_name').value;
        const isSupplierAlphabetic = /^[\p{L}\p{M}\s]+$/u.test(supName);

        if (!isSupplierAlphabetic) {
            alert("Supplier Name must contain only letters.");
            document.getElementById('loading-spinner').style.display = 'none';
            return false; // Prevent form submission
        }

        // Send AJAX request to check if the material name exists
        try {
            const response = await fetch('/check-material-existence?material_name=' + materialName);
            
            if (response.ok) {
                const data = await response.json();
                
                // If material name exists, alert and prevent form submission
                if (data.exists) {
                    alert("Material name already exists. Please choose a different name.");
                    document.getElementById('loading-spinner').style.display = 'none';
                    return false; // Prevent form submission
                } else {
                    // If material name doesn't exist, submit the form
                    document.getElementById("product_form").submit();
                }
            } else {
                // Handle any error with the AJAX request
                alert("An error occurred while checking material name.");
                document.getElementById('loading-spinner').style.display = 'none';
                return false; // Prevent form submission
            }
        } catch (error) {
            alert("An unexpected error occurred.");
            document.getElementById('loading-spinner').style.display = 'none';
            return false; // Prevent form submission
        }
    }
</script>

{% endblock %}
