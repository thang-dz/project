{% extends 'base.html' %}

{% block title %}
<title>Add New Import</title>
<style>
    /* Màu sắc chủ đạo */
    :root {
        --primary: #4e73df;
        --primary-dark: #2e59d9;
        --primary-light: #eaeffd;
        --success: #1cc88a;
        --danger: #e74a3b;
        --dark: #5a5c69;
        --light-gray: #f8f9fc;
    }
    
    /* Nền trang */
    main {
        background: linear-gradient(135deg, #f8f9fc 0%, #eaeffd 100%);
        padding: 20px 0;
        min-height: calc(100vh - 60px);
    }
    
    /* Tiêu đề trang */
    h1.mt-4 {
        font-weight: 700;
        color: var(--dark);
        position: relative;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }
    
    h1.mt-4:after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 60px;
        height: 4px;
        background: linear-gradient(to right, var(--primary), var(--primary-light));
        border-radius: 2px;
    }
    
    /* Card */
    .card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(149, 157, 165, 0.15);
        overflow: hidden;
        transition: all 0.3s ease;
    }
    
    .card:hover {
        box-shadow: 0 12px 30px rgba(149, 157, 165, 0.2);
        transform: translateY(-5px);
    }
    
    .card-header {
        background: linear-gradient(45deg, #4e73df, #6e8eff);
        color: white;
        font-weight: 600;
        padding: 16px 20px;
        border: none;
        position: relative;
        overflow: hidden;
    }
    
    .card-header:before {
        content: '';
        position: absolute;
        top: -50%;
        right: -50%;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
    }
    
    .card-body {
        padding: 30px 25px;
        background-color: white;
    }
    
    /* Form fields */
    label {
        font-weight: 600;
        color: var(--dark);
        margin-bottom: 10px;
        display: block;
        transition: all 0.3s;
    }
    
    .form-control {
        border-radius: 8px;
        padding: 12px 15px;
        border: 2px solid #e6e9f0;
        font-size: 15px;
        transition: all 0.3s;
        background-color: #fcfcfc;
        margin-bottom: 20px;
    }
    
    .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(78, 115, 223, 0.15);
        background-color: white;
    }
    
    /* Nút submit */
    .btn {
        border-radius: 8px;
        font-weight: 600;
        padding: 12px 24px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        z-index: 1;
    }
    
    .btn:after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 0;
        background: rgba(0, 0, 0, 0.1);
        z-index: -1;
        transition: all 0.3s ease;
    }
    
    .btn:hover:after {
        height: 100%;
    }
    
    .btn-primary {
        background: linear-gradient(45deg, var(--primary), var(--primary-dark));
        border: none;
        box-shadow: 0 4px 12px rgba(78, 115, 223, 0.3);
    }
    
    .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 15px rgba(78, 115, 223, 0.4);
    }
    
    /* Breadcrumb */
    .breadcrumb {
        background-color: transparent;
        padding: 0;
        margin-bottom: 25px;
        border-radius: 4px;
        display: flex;
        align-items: center;
    }
    
    .breadcrumb-item a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s;
    }
    
    .breadcrumb-item a:hover {
        color: var(--primary-dark);
    }
    
    .breadcrumb-item.active {
        color: var(--dark);
        font-weight: 500;
    }
    
    /* Field group styling */
    .form-group {
        margin-bottom: 20px;
        position: relative;
    }
    
    .text-danger {
        color: var(--danger) !important;
    }
    
    /* Form container styling */
    .form-row {
        display: flex;
        flex-wrap: wrap;
        margin-right: -10px;
        margin-left: -10px;
    }
    
    .form-col {
        flex: 0 0 50%;
        max-width: 50%;
        padding: 0 10px;
    }
    
    @media (max-width: 768px) {
        .form-col {
            flex: 0 0 100%;
            max-width: 100%;
        }
    }
    
    /* Input with icon */
    .input-with-icon {
        position: relative;
    }
    
    .input-icon {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        left: 15px;
        color: #b1b1b1;
        transition: all 0.3s;
    }
    
    .input-with-icon .form-control {
        padding-left: 40px;
    }
    
    .input-with-icon .form-control:focus + .input-icon {
        color: var(--primary);
    }
    
    /* Form section */
    .form-section {
        padding-bottom: 15px;
        margin-bottom: 30px;
        border-bottom: 1px solid #e6e9f0;
    }
    
    .form-section-title {
        font-weight: 600;
        color: var(--primary);
        margin-bottom: 20px;
        font-size: 18px;
    }
</style>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid">
        <h1 class="mt-4">Add New Import</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="/"><i class="fas fa-home mr-1"></i> Dashboard</a></li>
            <li class="breadcrumb-item"><a href="/import/"><i class="fas fa-file-import mr-1"></i> Imports</a></li>
            <li class="breadcrumb-item active"><i class="fas fa-plus-circle mr-1"></i> Add Import</li>
        </ol>

        <div class="card mb-4">
            <div class="card-header">
                <i class="fas fa-file-import mr-2"></i> New Import Details
            </div>
            <div class="card-body">
                <form id="product_form" action="/import/" method="POST" onsubmit="return checkForm(event)">
                    <!-- Material Section -->
                    <div class="form-section">
                        <h5 class="form-section-title"><i class="fas fa-boxes mr-2"></i> Material Information</h5>
                        <div class="form-row">
                            <div class="form-col">
                                <div class="form-group">
                                    <label for="material_name">
                                        <i class="fas fa-box mr-2"></i> Material Name <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-with-icon">
                                        <input type="text" id="material_name" name="material_name" class="form-control" required placeholder="Enter material name">
                                        <i class="fas fa-box input-icon"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="form-col">
                                <div class="form-group">
                                    <label for="quantity_in_stock">
                                        <i class="fas fa-sort-amount-up mr-2"></i> Quantity <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-with-icon">
                                        <input type="number" id="quantity_in_stock" name="quantity_in_stock" class="form-control" required placeholder="Enter quantity">
                                        <i class="fas fa-sort-amount-up input-icon"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="reorder_level">
                                <i class="fas fa-level-down-alt mr-2"></i> Reorder Level
                            </label>
                            <div class="input-with-icon">
                                <input type="number" id="reorder_level" name="reorder_level" class="form-control" value="30" placeholder="Enter reorder level">
                                <i class="fas fa-level-down-alt input-icon"></i>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Supplier Section -->
                    <div class="form-section">
                        <h5 class="form-section-title"><i class="fas fa-truck mr-2"></i> Supplier Information</h5>
                        <div class="form-group">
                            <label for="sup_name">
                                <i class="fas fa-building mr-2"></i> Supplier Name <span class="text-danger">*</span>
                            </label>
                            <div class="input-with-icon">
                                <input type="text" id="sup_name" name="sup_name" class="form-control" required placeholder="Enter supplier name">
                                <i class="fas fa-building input-icon"></i>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-col">
                                <div class="form-group">
                                    <label for="sup_contact_info">
                                        <i class="fas fa-phone mr-2"></i> Supplier Phone Number <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-with-icon">
                                        <input type="number" id="sup_contact_info" name="sup_contact_info" class="form-control" required placeholder="Enter phone number">
                                        <i class="fas fa-phone input-icon"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="form-col">
                                <div class="form-group">
                                    <label for="sup_address">
                                        <i class="fas fa-map-marker-alt mr-2"></i> Supplier Address <span class="text-danger">*</span>
                                    </label>
                                    <div class="input-with-icon">
                                        <input type="text" id="sup_address" name="sup_address" class="form-control" required placeholder="Enter supplier address">
                                        <i class="fas fa-map-marker-alt input-icon"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
        
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-plus-circle mr-2"></i> Add Import
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<script>
    // Add focus effect to input fields
    document.addEventListener('DOMContentLoaded', function() {
        const inputs = document.querySelectorAll('.form-control');
        
        inputs.forEach(input => {
            // On focus
            input.addEventListener('focus', function() {
                this.parentElement.querySelector('.input-icon').style.color = '#4e73df';
            });
            
            // On blur
            input.addEventListener('blur', function() {
                if (this.value === '') {
                    this.parentElement.querySelector('.input-icon').style.color = '#b1b1b1';
                }
            });
            
            // Check initial value
            if (input.value !== '') {
                input.parentElement.querySelector('.input-icon').style.color = '#4e73df';
            }
        });
    });

    async function checkForm(event) {
        event.preventDefault(); // Prevent the form from submitting until validation is complete
        
        // Add loading state to button
        const submitBtn = document.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.innerHTML;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm mr-2" role="status" aria-hidden="true"></span> Processing...';
        submitBtn.disabled = true;
        
        // Validate Material Name (only alphabets and spaces)
        const materialName = document.getElementById('material_name').value;
        const isMaterialAlphabetic = /^[\p{L}\p{M}\s]+$/u.test(materialName);

        if (!isMaterialAlphabetic) {
            alert("Material Name must contain only letters.");
            submitBtn.innerHTML = originalBtnText;
            submitBtn.disabled = false;
            return false; // Prevent form submission
        }
        
        // Validate Quantity (greater than 0)
        const quantityInStock = document.getElementById('quantity_in_stock').value;
        if (quantityInStock <= 0) {
            alert("Value must be a number greater than 0.");
            submitBtn.innerHTML = originalBtnText;
            submitBtn.disabled = false;
            return false; // Prevent form submission
        }

        // Validate Supplier Name (only alphabets and spaces)
        const supName = document.getElementById('sup_name').value;
        const isSupplierAlphabetic = /^[\p{L}\p{M}\s]+$/u.test(supName);

        if (!isSupplierAlphabetic) {
            alert("Supplier Name must contain only letters.");
            submitBtn.innerHTML = originalBtnText;
            submitBtn.disabled = false;
            return false; // Prevent form submission
        }

        // Send AJAX request to check if the material name exists
        try {
            const response = await fetch('/check-material-existence?material_name=' + encodeURIComponent(materialName));
            
            if (response.ok) {
                const data = await response.json();
                
                // If material name exists, alert and prevent form submission
                if (data.exists) {
                    alert("Material name already exists. Please choose a different name.");
                    submitBtn.innerHTML = originalBtnText;
                    submitBtn.disabled = false;
                    return false; // Prevent form submission
                } else {
                    // If material name doesn't exist, submit the form
                    document.getElementById("product_form").submit();
                }
            } else {
                // Handle any error with the AJAX request
                alert("An error occurred while checking material name.");
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                return false; // Prevent form submission
            }
        } catch (error) {
            alert("An unexpected error occurred.");
            submitBtn.innerHTML = originalBtnText;
            submitBtn.disabled = false;
            return false; // Prevent form submission
        }
    }
</script>
{% endblock %}
