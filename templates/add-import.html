{% extends 'base.html' %}

{% block title %}
    <title>Add New Import</title>
{% endblock %}

{% block content %}
<main>
    <div class="container-fluid">
        <h1 class="mt-4">Add New Import</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a href="/">Dashboard</a></li>
            <li class="breadcrumb-item active">Add Import</li>
        </ol>

        <div class="card mb-4">
            <div class="card-header">New Import</div>
            <div class="card-body">
                <form id="product_form" action="/import/" method="POST" onsubmit="return checkForm(event)">
                    <label for="material_name">Material Name <span class="text-danger">*</span></label>
                    <input type="text" id="material_name" name="material_name" class="form-control" required><br>
        
                    <label for="quantity_in_stock">Quantity <span class="text-danger">*</span></label>
                    <input type="number" id="quantity_in_stock" name="quantity_in_stock" class="form-control" required><br>
        
                    <label for="reorder_level">Reorder Level</label>
                    <input type="number" name="reorder_level" class="form-control" value="30"><br>
        
                    <label for="sup_name">Supplier Name <span class="text-danger">*</span></label>
                    <input type="text" id="sup_name" name="sup_name" class="form-control" required><br>
        
                    <label for="sup_contact_info">Supplier Phone Number <span class="text-danger">*</span></label>
                    <input type="number" name="sup_contact_info" class="form-control" required><br>
        
                    <label for="sup_address">Supplier Address <span class="text-danger">*</span></label>
                    <input type="text" name="sup_address" class="form-control" required><br>
        
                    <button type="submit" class="btn btn-primary">Add Import</button>
                </form>
            </div>
        </div>
    </div>
</main>

<script>
    async function checkForm(event) {
        event.preventDefault(); // Prevent the form from submitting until the check is complete
        
        // Validate Material Name (only alphabets and spaces)
        const materialName = document.getElementById('material_name').value;
        const isMaterialAlphabetic =  /^[\p{L}\p{M}\s]+$/u.test(materialName);

        if (!isMaterialAlphabetic) {
            alert("Material Name must contain only letters.");
            return false; // Prevent form submission
        }
        
        // Validate Quantity (greater than 0)
        const quantityInStock = document.getElementById('quantity_in_stock').value;
        if (quantityInStock <= 0) {
            alert("Value must be a number greater than 0.");
            return false; // Prevent form submission
        }

        // Validate Supplier Name (only alphabets and spaces)
        const supName = document.getElementById('sup_name').value;
        const isSupplierAlphabetic =/^[\p{L}\p{M}\s]+$/u.test(supName);

        if (!isSupplierAlphabetic) {
            alert("Supplier Name must contain only letters.");
            return false; // Prevent form submission
        }

        // Send AJAX request to check if the material name exists
        try {
            const response = await fetch('/check-material-existence?material_name=' + materialName);
            
            if (response.ok) {
                const data = await response.json();
                
                // If material name exists, alert and prevent form submission
                if (data.exists) {
                    alert("Material name already exists. Please choose a different name.");
                    return false; // Prevent form submission
                } else {
                    // If material name doesn't exist, submit the form
                    document.getElementById("product_form").submit();
                }
            } else {
                // Handle any error with the AJAX request
                alert("An error occurred while checking material name.");
                return false; // Prevent form submission
            }
        } catch (error) {
            alert("An unexpected error occurred.");
            return false; // Prevent form submission
        }
    }
</script>

{% endblock %}
